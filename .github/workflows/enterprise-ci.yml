name: Enterprise CI

# Enterprise-layer gate for the fork line: focused hub backend tests +
# console suite/build. Upstream workflows only trigger on main/dev, so
# this covers feature/enterprise pushes and PRs targeting it.

on:
  push:
    branches: ["feature/enterprise", "enterprise/**"]
    paths:
      - "src/qwenpaw/hub/**"
      - "tests/unit/hub/**"
      - "console/**"
      - ".github/workflows/enterprise-ci.yml"
  pull_request:
    branches: ["feature/enterprise"]
    paths:
      - "src/qwenpaw/hub/**"
      - "tests/unit/hub/**"
      - "console/**"
      - ".github/workflows/enterprise-ci.yml"
  workflow_dispatch:

concurrency:
  group: enterprise-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub-backend:
    name: Hub backend (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with test + hub extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,hub]"

      - name: Run hub unit suite (ACL, proxy, provisioners)
        run: pytest tests/unit/hub -v

  console:
    name: Console (node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      # console/pnpm-workspace.yaml allowBuilds covers esbuild, so no
      # interactive approve-builds step is needed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest suite
        run: pnpm exec vitest run

      - name: Production build
        run: pnpm run build
