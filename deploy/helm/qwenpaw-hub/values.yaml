# QwenPaw Hub enterprise intranet chart (EP-1-8)
#
# The hub is single-replica BY DESIGN: sqlite + in-memory runtime
# registry must have exactly one writer (06 §3). Do not raise
# `hub.replicas` unless state has been externalized (Phase 2+).

image:
  # Intranet registry prefix incl. trailing slash, e.g. "harbor.corp.local/"
  registry: ""
  repository: qwenpaw-hub
  tag: "2.2.0"
  pullPolicy: IfNotPresent

hub:
  # A4: mount credentials through a K8s Secret resource instead of
  # plain env entries in the Deployment spec. off = legacy env flow
  secretProvider:
    enabled: false
    # optional: OIDC client secret delivered the same way
    # oidcClientSecret: ""
  replicas: 1
  port: 8088
  # Persisted sqlite + audit + secrets (RWO is sufficient).
  storage:
    className: "" # empty = cluster default StorageClass
    size: 5Gi
  # Intranet exposure: ClusterIP by default; set type: NodePort or
  # LoadBalancer only inside the trusted network.
  service:
    type: ClusterIP
    port: 80
  # Hub admin bootstrap (first admin credentials) — change me.
  adminUsername: owner
  adminPassword: "" # required; created idempotently by the initContainer
  # In-cluster public base URL; defaults to the Service DNS name.
  publicBaseUrl: ""
  registrationEnabled: false

runtimes:
  namespace: qwenpaw-runtimes
  image:
    # Defaults to the hub image: the same container runs the runtime
    # entrypoint with a different command.
    repository: qwenpaw-runtime
    tag: "2.2.0"
  # The runtime container entrypoint listens on QWENPAW_PORT (8088
  # in the official image); override for custom runtime images only.
  port: 8088
  clusterDomain: cluster.local
  storage:
    className: ""
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # A12 GPU affinity placeholders — left empty in Phase 1.
  nodeSelector: {}
  tolerations: []
  startupTimeoutSeconds: 300

serviceAccount:
  create: true
  name: qwenpaw-hub

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []

# --- Production hardening (K8s checklist, 02 matrix G6/audit §4) ---

podDisruptionBudget:
  # With a single replica this renders minAvailable: 0 — it exists so
  # `kubectl drain` surfaces an explicit budget instead of silently
  # evicting the only writer. Raise replicas > 1 (state externalized)
  # and the template switches to replicas-1 automatically.
  enabled: false

podAntiAffinity:
  # Only effective above one replica; kept as a switch so multi-replica
  # futures do not need a chart change.
  enabled: false

probes:
  startup:
    # Absorbs cold-PVC migrations before liveness counts.
    enabled: true
    periodSeconds: 5
    failureThreshold: 60
  liveness:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 20
    failureThreshold: 3

# Pod-level context. The official image currently runs as root;
# enable runAsNonRoot only after the image carries a numeric USER.
podSecurityContext: {}
  # runAsNonRoot: true
  # runAsUser: 1000
  # fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

ingress:
  enabled: false
  className: nginx
  # Intranet FQDN routed to the hub service.
  host: hub.corp.local
  tls:
    enabled: false
    # Pre-created TLS Secret (cert-manager or ops-managed).
    secretName: ""

networkPolicy:
  # Default-deny ingress; explicit egress (DNS, runtime ns, K8s API,
  # listed CIDRs). Keep off until the namespace topology is settled.
  enabled: false
  allowedNamespaces: [] # e.g. [ingress-nginx]
  allowedCIDRs: [] # admin/intranet ranges, e.g. [10.0.0.0/8]
  kubeApiCIDR: 10.96.0.1/32
  egressCIDRs: [] # OIDC/model provider endpoints

