# Environment tier: prod (EP-2-10, I2).
# Single writer (sqlite) with canary-gated cutover; nightly backup;
# pod disruption budget sized for the Recreate reality (minAvailable 0
# on the hub, per-tenant runtimes rebuilt by the hub on drift).

image:
  tag: "2.2.0" # pinned release

# A4: credentials ride the K8s Secret resource (qwenpaw-hub-credentials)
hub:
  secretProvider:
    enabled: true
  replicas: 1
  storage:
    size: 20Gi
  service:
    type: ClusterIP
  registrationEnabled: false

runtimes:
  storage:
    size: 50Gi

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

# --- production hardening on ---
# PDB comment above now matches an actual template (hub-pdb.yaml).
podDisruptionBudget:
  enabled: true

probes:
  startup:
    enabled: true
  liveness:
    enabled: true

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Enable once the ingress controller namespace and admin CIDRs are
# settled for this cluster (see networkPolicy block in values.yaml):
# networkPolicy:
#   enabled: true
#   allowedNamespaces: [ingress-nginx]
#   allowedCIDRs: [10.0.0.0/8]

# Deployment-strategy metadata: consumed by the GitOps layer and
# runbook-canary-upgrade.md (the chart templates themselves do not
# render these keys).
backup:
  enabled: true
  schedule: "0 18 * * *" # follow-the-sun low traffic
upgrade:
  strategy: canary
  # smoke gates the cutover must pass (runbook-canary-upgrade.md)
  smoke:
    login: true
    healthz: true
    permissions: true
