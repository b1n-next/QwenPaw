# Environment tier: staging (EP-2-10, I2).
# Production-shaped but disposable: same resource envelope as prod,
# daily backups on, registration closed, smoke-gated deploys.

image:
  tag: "2.2.0" # candidate release under test

hub:
  replicas: 1
  storage:
    size: 5Gi
  service:
    type: ClusterIP
  registrationEnabled: false

runtimes:
  storage:
    size: 10Gi

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Deployment-strategy metadata: consumed by the GitOps layer and
# runbook-canary-upgrade.md (the chart templates themselves do not
# render these keys).
backup:
  enabled: true
  schedule: "0 2 * * *"
upgrade:
  strategy: canary # smoke gate before the service cutover
