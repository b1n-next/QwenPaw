apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwenpaw-hub
  labels:
    app.kubernetes.io/name: qwenpaw-hub
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.hub.replicas }}
  strategy:
    type: Recreate # single writer (sqlite PVC) — no rolling overlap
  selector:
    matchLabels:
      app.kubernetes.io/name: qwenpaw-hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwenpaw-hub
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      initContainers:
        # EP-1-8: public bind refuses to start before an enabled admin
        # exists; create the first admin idempotently on the hub PVC.
        # #7696 replacement: the shell delegates to the official
        # hub/bootstrap.py API; only the non-interactive + idempotent
        # container wrapper remains ours.
        - name: bootstrap-admin
          image: "{{ .Values.image.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: QWENPAW_HUB_DIR
              value: /var/lib/qwenpaw
          command:
            - python
            - -m
            - qwenpaw.hub.bootstrap_admin
            - --username
            - {{ .Values.hub.adminUsername | quote }}
            - --password
            - {{ required "hub.adminPassword is required" .Values.hub.adminPassword | quote }}
          volumeMounts:
            - name: hub-data
              mountPath: /var/lib/qwenpaw
            - name: hub-config
              mountPath: /etc/qwenpaw
              readOnly: true
      containers:
        - name: hub
          image: "{{ .Values.image.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - qwenpaw
            - hub
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.hub.port | quote }}
            - --force-public
            - --config
            - /etc/qwenpaw/hub.yaml
          ports:
            - name: http
              containerPort: {{ .Values.hub.port }}
          env:
            - name: QWENPAW_HUB_DIR
              value: /var/lib/qwenpaw
            - name: QWENPAW_HUB_ADMIN_USERNAME
              value: {{ .Values.hub.adminUsername | quote }}
            - name: QWENPAW_HUB_ADMIN_PASSWORD
              value: {{ required "hub.adminPassword is required" .Values.hub.adminPassword | quote }}
            # --- k8s runtime provisioner (EP-1-6) ---
            - name: QWENPAW_HUB_K8S_NAMESPACE
              value: {{ .Values.runtimes.namespace | quote }}
            - name: QWENPAW_HUB_K8S_IMAGE
              value: "{{ .Values.image.registry }}{{ .Values.runtimes.image.repository }}:{{ .Values.runtimes.image.tag }}"
            - name: QWENPAW_HUB_K8S_PORT
              value: {{ .Values.runtimes.port | quote }}
            - name: QWENPAW_HUB_K8S_CLUSTER_DOMAIN
              value: {{ .Values.runtimes.clusterDomain | quote }}
            - name: QWENPAW_HUB_K8S_PVC_SIZE
              value: {{ .Values.runtimes.storage.size | quote }}
            - name: QWENPAW_HUB_K8S_STARTUP_TIMEOUT
              value: {{ .Values.runtimes.startupTimeoutSeconds | quote }}
            # Hub proxy may reach runtime Service DNS names under these
            # suffixes only (fail-closed elsewhere; 06 §2).
            - name: QWENPAW_HUB_RUNTIME_HOST_SUFFIXES
              value: "svc,svc.{{ .Values.runtimes.clusterDomain }}"
            {{- with .Values.runtimes.storage.className }}
            - name: QWENPAW_HUB_K8S_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimes.resources.requests.cpu }}
            - name: QWENPAW_HUB_K8S_CPU_REQUEST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimes.resources.requests.memory }}
            - name: QWENPAW_HUB_K8S_MEMORY_REQUEST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimes.resources.limits.cpu }}
            - name: QWENPAW_HUB_K8S_CPU_LIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtimes.resources.limits.memory }}
            - name: QWENPAW_HUB_K8S_MEMORY_LIMIT
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: hub-data
              mountPath: /var/lib/qwenpaw
            - name: hub-config
              mountPath: /etc/qwenpaw
              readOnly: true
          readinessProbe:
            # /api/hub/healthz requires a session; the console index is
            # the unauthenticated liveness surface.
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: hub-data
          persistentVolumeClaim:
            claimName: qwenpaw-hub-data
        - name: hub-config
          configMap:
            name: qwenpaw-hub-config
