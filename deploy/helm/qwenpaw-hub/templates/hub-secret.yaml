{{- if .Values.hub.secretProvider.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-hub-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: qwenpaw-hub
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: qwenpaw
type: Opaque
stringData:
  # A4: credentials ride a Secret resource instead of plain env
  # values in the Deployment spec (visible to anyone who can read
  # the Deployment). The bootstrap password seeds the first admin;
  # OIDC client secret is optional (empty = local login only).
  QWENPAW_HUB_ADMIN_USERNAME: {{ .Values.hub.adminUsername | quote }}
  QWENPAW_HUB_ADMIN_PASSWORD: {{ required "hub.adminPassword is required" .Values.hub.adminPassword | quote }}
  {{- with .Values.hub.secretProvider.oidcClientSecret }}
  QWENPAW_HUB_OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
