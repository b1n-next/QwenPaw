{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
# Runtimes namespace — per-tenant Pods + PVCs + Services live here
# (06 §1: hub and runtimes stay in separate namespaces).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.runtimes.namespace }}
  labels:
    app.kubernetes.io/part-of: qwenpaw
---
# Minimal namespaced rights for the hub ServiceAccount in the
# runtimes namespace: create/read/delete tenant pods, PVCs, services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qwenpaw-hub-runtime-manager
  namespace: {{ .Values.runtimes.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qwenpaw-hub-runtime-manager
  namespace: {{ .Values.runtimes.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: qwenpaw-hub-runtime-manager
  apiGroup: rbac.authorization.k8s.io
---
# Read-only, cluster-scoped: preflight GETs the runtimes Namespace
# object to fail-closed with an actionable message (06 §2).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: qwenpaw-hub-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: qwenpaw-hub-namespace-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: qwenpaw-hub-namespace-reader
  apiGroup: rbac.authorization.k8s.io
