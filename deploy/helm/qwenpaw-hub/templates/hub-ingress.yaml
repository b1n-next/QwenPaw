{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qwenpaw-hub
  labels:
    app.kubernetes.io/name: qwenpaw-hub
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # WebSocket proxying (/api/...) needs long timeouts at the
          # controller; the annotations below cover the common
          # ingress-nginx defaults — adjust for other controllers.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qwenpaw-hub
                port:
                  number: {{ .Values.hub.service.port }}
{{- end }}
