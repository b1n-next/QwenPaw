# PrometheusRule samples for QwenPaw Hub (EP-2-4, 07 §4).
# Three baseline alerts ship with the /metrics endpoint:
#   1. runtime missing   — a tenant's runtime left the running state
#   2. collection stale  — usage pipeline stopped refreshing
#   3. ACL denial burst  — access-control rejections at an unusual rate
#
# Scrape config companion (bearer token of any hub user, or scope a
# dedicated monitoring identity in front of the hub):
#
#   scrape_configs:
#     - job_name: qwenpaw-hub
#       scrape_interval: 30s
#       metrics_path: /api/hub/metrics
#       authorization:
#         type: Bearer
#         credentials_file: /etc/prometheus/qwenpaw-hub-token
#       static_configs:
#         - targets: ["qwenpaw-hub:8000"]
#
# Exposed families:
#   qwenpaw_hub_requests_total{decision,role}        counter
#     decision: allowed | denied | denied_quota
#   qwenpaw_hub_quota_soft_total{dimension}          counter
#   qwenpaw_runtime_state{state,tenant}              gauge (1 per live state)
#   qwenpaw_hub_tokens_total{model}                  gauge (usage-store totals)
#   qwenpaw_usage_last_success_timestamp_seconds     gauge (unix epoch)
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qwenpaw-hub-baseline
  labels:
    app.kubernetes.io/name: qwenpaw-hub
spec:
  groups:
    - name: qwenpaw-hub.runtime
      rules:
        - alert: QwenPawRuntimeMissing
          expr: |
            sum by (tenant) (qwenpaw_runtime_state{state="running"})
              == 0
            and on() (time() - qwenpaw_usage_last_success_timestamp_seconds) < 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "QwenPaw runtime not running for {{ $labels.tenant }}"
            description: >-
              The runtime recorded for tenant {{ $labels.tenant }} has not
              been in the running state for 5 minutes while the usage
              pipeline is still fresh. Check the runtime record and pod.
        - alert: QwenPawUsageCollectionStale
          expr: |
            time() - qwenpaw_usage_last_success_timestamp_seconds > 1800
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "QwenPaw usage collection stale ({{ $value | humanizeDuration }})"
            description: >-
              The hub usage collector has not completed a pass in over 30
              minutes. Token quotas and the admin usage page are drifting.
    - name: qwenpaw-hub.access
      rules:
        - alert: QwenPawAclDenialBurst
          expr: |
            sum(rate(qwenpaw_hub_requests_total{decision=~"denied.*"}[15m]))
              > 0.2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "QwenPaw ACL/quota denial rate elevated"
            description: >-
              Sustained {{ $value }} denials/sec over 15 minutes across the
              hub proxy. Inspect the audit ledger (acl.denied /
              quota.exceeded) for the driving identity and path.
